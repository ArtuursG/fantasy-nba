name: Daily report

on:
  schedule:
    # Hourly: GitHub starts scheduled runs late and skips some when busy,
    # so asking often keeps the gaps short. The page's Refresh starts one
    # at any time.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  # Writes the data branch the page reads.
  contents: write

concurrency:
  group: daily-report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ESPN_LEAGUE_URL: ${{ secrets.ESPN_LEAGUE_URL }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      FANTASY_PUNT: ${{ vars.FANTASY_PUNT }}
      FANTASY_TZ: Europe/Riga
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Restore snapshot history
        uses: actions/cache/restore@v6
        with:
          path: data
          key: snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: snapshots-
      - run: uv sync --no-dev
      - name: Read the league and write the reports
        run: |
          uv run fantasy daily --out reports/full.md --notify
          uv run fantasy report --compact --out reports/compact.md
      - name: Save snapshot history
        if: always()
        uses: actions/cache/save@v6
        with:
          path: data
          # A re-run gets its own key: a cache key can't be written twice.
          key: snapshots-${{ github.run_id }}-${{ github.run_attempt }}
      # Run logs and artifacts of a public repository are public too.
      - name: Attach the reports
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v7
        with:
          name: fantasy-report
          path: reports/
          retention-days: 14
      # The page (deployed by pages.yml only when its code changes) reads
      # data.json from the data branch: one commit, replaced every run, so
      # no new Pages deployment and no history piling up.
      - name: Publish the data for the page
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run fantasy export --data --out public
          cd public
          git init -q -b data
          git add data.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "League data"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
