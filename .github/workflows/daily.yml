name: Daily report

# Reads the league every morning, keeps the snapshot history in the Actions
# cache (so "since yesterday" and "vs 7 days ago" work) and attaches the
# report to the run. Needs the ESPN_S2 and ESPN_SWID repository secrets;
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are optional.

on:
  schedule:
    # 05:52 UTC: 07:52 in Riga in winter, 08:52 in summer, after the last NBA games.
    - cron: "52 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ESPN_LEAGUE_URL: https://fantasy.espn.com/basketball/team?leagueId=350604&teamId=2
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      FANTASY_PUNT: ${{ vars.FANTASY_PUNT }}
      FANTASY_TZ: Europe/Riga
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Restore snapshot history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-
      - run: uv sync --no-dev
      - name: Read the league and write the reports
        run: |
          uv run fantasy daily --out reports/full.md --summary "$GITHUB_STEP_SUMMARY" --notify
          uv run fantasy report --compact --out reports/compact.md
      - name: Save snapshot history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: snapshots-${{ github.run_id }}
      - name: Attach the reports
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-report
          path: reports/
          retention-days: 14
