name: Daily report

on:
  schedule:
    # 05:52 UTC: 07:52 in Riga in winter, 08:52 in summer, after the last NBA games.
    - cron: "52 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ESPN_LEAGUE_URL: ${{ secrets.ESPN_LEAGUE_URL }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      FANTASY_PUNT: ${{ vars.FANTASY_PUNT }}
      FANTASY_TZ: Europe/Riga
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Restore snapshot history
        uses: actions/cache/restore@v4
        with:
          path: data
          key: snapshots-${{ github.run_id }}
          restore-keys: snapshots-
      - run: uv sync --no-dev
      - name: Read the league and write the reports
        run: |
          uv run fantasy daily --out reports/full.md --notify
          uv run fantasy report --compact --out reports/compact.md
      - name: Save snapshot history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: snapshots-${{ github.run_id }}
      # Run logs and artifacts of a public repository are public too.
      - name: Attach the reports
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-report
          path: reports/
          retention-days: 14
      - name: Build the dashboard
        if: ${{ !github.event.repository.private }}
        run: uv run fantasy export --out site
      - name: Prepare the dashboard for GitHub Pages
        if: ${{ !github.event.repository.private }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: report
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
