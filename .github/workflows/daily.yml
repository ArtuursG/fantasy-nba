name: Daily report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ESPN_LEAGUE_URL: ${{ secrets.ESPN_LEAGUE_URL }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      FANTASY_PUNT: ${{ vars.FANTASY_PUNT }}
      FANTASY_TZ: Europe/Riga
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - uses: actions/cache/restore@v6
        with:
          path: data
          key: snapshots-none
          restore-keys: snapshots-
      - run: uv sync --no-dev
      - run: |
          uv run fantasy refresh --save-raw raw
          uv run python diag.py
