name: Daily report

on:
  schedule:
    # Hourly: GitHub starts scheduled runs late and skips some when busy,
    # so asking often keeps the gaps short. The page's Refresh starts one
    # at any time.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  # Writes the data branch the page reads.
  contents: write

concurrency:
  group: daily-report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ESPN_LEAGUE_URL: ${{ secrets.ESPN_LEAGUE_URL }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      FANTASY_PUNT: ${{ vars.FANTASY_PUNT }}
      FANTASY_TZ: Europe/Riga
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
      - name: Restore snapshot history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          key: snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: snapshots-
      # The history (one snapshot a day, forecasts, results, injury statuses)
      # lives in that cache; the data branch keeps a copy in case GitHub
      # ever drops the cache.
      - name: Fall back to the history copy on the data branch
        if: ${{ !github.event.repository.private }}
        run: |
          if [ ! -f data/fantasy.db ]; then
            mkdir -p data
            if curl -fsSL -o data/fantasy.db \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/history.db"; then
              echo "History restored from the data branch."
            else
              rm -f data/fantasy.db
            fi
          fi
      # --locked: exactly the versions in uv.lock, or the run fails. This job
      # holds the ESPN cookies and the Telegram token.
      - run: uv sync --no-dev --locked
      - name: Read the league and write the reports
        run: |
          uv run fantasy daily --out reports/full.md --notify
          uv run fantasy report --compact --out reports/compact.md
      - name: Save snapshot history
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data
          # A re-run gets its own key: a cache key can't be written twice.
          key: snapshots-${{ github.run_id }}-${{ github.run_attempt }}
      # Run logs and artifacts of a public repository are public too.
      - name: Attach the reports
        if: ${{ github.event.repository.private }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fantasy-report
          path: reports/
          retention-days: 14
      # The page (deployed by pages.yml only when its code changes) reads
      # data.json from the data branch: one commit, replaced every run, so
      # no new Pages deployment and no history piling up.
      - name: Publish the data for the page
        if: ${{ !github.event.repository.private }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run fantasy export --data --out public
          # Without the league members' ESPN account names: the branch is public.
          uv run fantasy export --history --out public
          cd public
          git init -q -b data
          git add data.json history.db
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "League data"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
