[project]
name = "fantasy"
version = "0.1.0"
description = "Daily ESPN Fantasy Basketball snapshot and a ChatGPT-ready report"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tzdata>=2024.2",
]

[project.scripts]
fantasy = "fantasy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
